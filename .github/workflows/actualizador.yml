name: Actualizador de Precios SNIIM

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mineria_de_datos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias necesarias
        run: |
          pip install pandas numpy

      - name: Ejecutar Actualización de Datos
        run: python bot_sniim.py

      - name: Subir los CSVs actualizados a GitHub
        run: |
          git config --global user.name 'SNIIM-Data-Bot'
          git config --global user.email 'bot@cuandosiembro.com'
          git add .
          git diff --staged --quiet || git commit -m "🤖 Actualización automática de bases de datos MVP"
          git push
