name: Actualizador de Precios SNIIM

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mineria_de_datos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema y Selenium
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager pandas lxml html5lib

      - name: Ejecutar Bot de Extracción SNIIM
        run: python bot_sniim.py

      - name: Subir los CSVs actualizados a GitHub
        run: |
          git config --global user.name 'SNIIM-Data-Bot'
          git config --global user.email 'bot@cuandosiembro.com'
          git add .
          git diff --staged --quiet || git commit -m "🤖 Actualización automática desde portal SNIIM"
          git push
