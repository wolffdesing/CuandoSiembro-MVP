name: Actualizador de Precios SNIIM

on:
  schedule:
    - cron: '0 3 * * 0' # Se ejecuta los domingos a las 3:00 AM UTC
  workflow_dispatch: # Activa el botón para correrlo manualmente

permissions:
  contents: write

jobs:
  mineria_de_datos:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerias para el Bot
        run: |
          pip install selenium webdriver-manager pandas lxml html5lib

      - name: Ejecutar Extraccion Masiva SNIIM
        run: python bot_sniim.py

      - name: Subir los CSVs actualizados a GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.csv
          
          # Bloque seguro: Verifica si hay cambios reales antes de intentar guardar
          if ! git diff-index --quiet HEAD; then
            git commit -m "🤖 Actualización automática de precios SNIIM"
            git push
          else
            echo "✅ No hay datos nuevos para actualizar hoy. Todo está al día."
          fi
